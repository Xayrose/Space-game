name: Build Android APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Prepare game for Android
        run: |
          mkdir -p android-web
          cp game/index.html android-web/index.html
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Space-Game.apk
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Space - Game for Android
          prerelease: true
          make_latest: false
          files: Space-Game.apk
          fail_on_unmatched_files: true
